name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'eqlog/**'
      - 'tests/**'
      - 'windows/**'
      - 'scripts/**'
      - 'assets/**'
      - 'launch.pyw'
      - 'pyproject.toml'
      - 'requirements-build.txt'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build tools
        run: |
          python -m pip install -r requirements-build.txt
          choco install nsis --version=3.11 -y --no-progress
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify frozen app
        run: python scripts/build_windows.py
      - name: Test install and uninstall
        run: python scripts/test_installer.py
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: EQLog-Windows-x64
          path: release/*
          if-no-files-found: error
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EQLog-Windows-test-results
          path: build/windows/*.json
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EQLog-Windows-x64
          path: release
      - name: Publish tested Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.sha256 \
            --verify-tag --title "EQLog $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
