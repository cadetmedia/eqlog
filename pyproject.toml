[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqlog-cleaner"
version = "0.1.0"
description = "Backup-first desktop log cleaner for EverQuest Legends"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eqlog = "eqlog.__main__:main"

[tool.setuptools.packages.find]
include = ["eqlog*"]
